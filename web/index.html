<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>近传</title>
<script>
/* 首屏主题引导：先落地 data-theme，避免白底闪一下再变深色 */
(function () {
  try {
    var pref = localStorage.getItem('lb.theme') || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var d = document.documentElement;
    d.dataset.theme = dark ? 'dark' : 'light';
    d.dataset.themePref = pref;
    d.dataset.motion = localStorage.getItem('lb.motion') || 'full';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="landscape-notice" role="status">
  <img src="/static/logo.png" alt="近传" width="44" height="44">
  <strong>请切换到横屏</strong><span>横置设备，或把窗口拉宽后继续。</span>
</div>
<div id="app">

  <nav class="rail" aria-label="主导航">
    <img class="rail-logo" src="/static/logo.png" alt="近传" width="34" height="34">
    <div class="rail-main">
      <button class="rail-btn" id="navChats" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.4-3.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 11.5h6"/></svg><span>会话</span>
      </button>
      <button class="rail-btn" id="navTransfers" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8h14m-4.5-4 4 4-4 4m5.5 4h-14m4.5-4-4 4 4 4"/></svg><span>传输</span><i id="railTransferDot" hidden aria-hidden="true"></i>
      </button>
      <button class="rail-btn" id="navGames" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7h9a4 4 0 0 1 3.8 2.9l1.1 4a2.6 2.6 0 0 1-4.3 2.6l-2.6-2.3h-5L7 16.5a2.6 2.6 0 0 1-4.3-2.6l1.1-4A4 4 0 0 1 7.5 7Z"/><path d="M6.6 10.7h4.3M8.8 8.6v4.2m6.6-1.4h.01m2.5-1.7h.01"/></svg><span>娱乐</span>
      </button>
    </div>
    <button class="rail-btn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h5m4 0h7M4 12h10m4 0h2M4 18h3m4 0h9"/>
        <circle cx="11" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>
      </svg>
      <span>设置</span></button>
  </nav>

  <aside class="sidebar" aria-label="会话列表">
    <div class="side-head">
      <h2>会话</h2><span class="count" id="peerCount">0</span>
      <button class="icon-btn" id="btnNewGroup" title="新建群聊" aria-label="新建群聊">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20a5.6 5.6 0 0 0-2.2-4.4"/></svg>
      </button>
      <button class="icon-btn" id="btnAdd" title="添加好友" aria-label="添加好友">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <label class="peer-search" for="peerSearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="peerSearch" aria-label="搜索好友或 IP" placeholder="搜索好友或 IP" autocomplete="off">
    </label>
    <div class="peer-list" id="peerList"></div>

    <button type="button" class="me-card" id="meCard" aria-label="设置个人资料" title="设置个人资料">
      <span class="avatar" id="meAvatar"></span>
      <span class="me-meta">
        <span class="me-name" id="meName">—</span>
        <span class="me-sub" id="meSub">—</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 5 5-5 5"/></svg>
    </button>
    <div id="connectionState" class="connection-pill" role="status"><i aria-hidden="true"></i><span id="connectionLabel">连接中</span></div>
  </aside>

  <main class="chat" id="chatRoot">
    <section class="empty" id="emptyState" aria-labelledby="emptyTitle">
      <div class="welcome">
        <img class="welcome-logo" src="/static/logo.png" alt="" width="58" height="58">
        <h1 id="emptyTitle">选择一个会话</h1>
        <p>在同一局域网内聊天、互传文件。</p>
        <button class="btn" id="welcomeAdd">添加好友</button>
      </div>
    </section>

    <div class="chat-pane hidden" id="chatPane">
      <header class="chat-head">
        <div class="chat-head-left">
          <div class="avatar sm" id="chatAvatar"></div>
          <div>
            <div class="chat-title" id="chatTitle">—</div>
            <div class="chat-sub" id="chatSub">—</div>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="btnChatSearch" title="搜索会话（Ctrl+F）" aria-label="搜索会话" aria-keyshortcuts="Control+F Meta+F" aria-controls="chatSearchPanel" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg></button>
          <button class="icon-btn" id="btnEditPeer" title="会话资料" aria-label="会话资料"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5m0-8h.01"/></svg></button>
          <button class="icon-btn" id="btnClearChat" title="清空记录" aria-label="清空记录"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9 7V4h6v3M6.5 7l1 13h9l1-13M10 10.5v6m4-6v6"/></svg></button>
        </div>
      </header>

      <div class="message-area">
      <div class="messages" id="messages" aria-label="聊天记录"></div>
      <section class="chat-search hidden" id="chatSearchPanel" aria-label="搜索当前会话">
        <div class="chat-search-controls">
          <label class="chat-search-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
            <input id="chatSearchInput" type="search" aria-label="搜索消息或文件名" placeholder="搜索消息或文件名" autocomplete="off"></label>
          <button id="chatSearchClose" type="button" class="icon-btn" aria-label="关闭会话搜索" title="关闭会话搜索"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="chatSearchTypes" role="group" aria-label="消息类型" class="chat-search-types">
          <button type="button" data-type="all" aria-pressed="true">全部</button>
          <button type="button" data-type="text" aria-pressed="false">消息</button>
          <button type="button" data-type="image" aria-pressed="false">图片</button>
          <button type="button" data-type="file" aria-pressed="false">文件</button>
          <button type="button" data-type="folder" aria-pressed="false">文件夹</button>
        </div>
        <p id="chatSearchSummary" role="status"></p>
        <div id="chatSearchResults" class="chat-search-results" aria-label="搜索结果"></div>
      </section>
      <button class="scroll-bottom" id="scrollBottom" title="回到最新" aria-label="回到最新">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      </div>

      <div class="composer" id="composer">
        <div class="reply-bar hidden" id="replyBar">
          <div class="reply-txt"><b id="replyName"></b><span id="replyText"></span></div>
          <button class="reply-cancel" id="replyCancel" title="取消回复">×</button>
        </div>
        <div class="draft-bar hidden" id="draftBar">
          <div class="draft-head">
            <span id="draftCount">待发送</span>
            <span class="draft-note">确认后点「发送」才会发出</span>
            <button class="draft-clear" id="draftClear">清空</button>
          </div>
          <div class="draft-list" id="draftList"></div>
        </div>
        <div class="composer-box">
          <textarea id="input" aria-label="消息内容" rows="1" placeholder="输入消息，Enter 发送 · Shift+Enter 换行"></textarea>
          <div class="composer-foot">
            <div class="tools">
              <button class="tool" id="btnImage" title="添加图片（也可 Ctrl+V 粘贴）" aria-label="添加图片">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 16l-5-5-5 5-2-2-6 6"/></svg>
              </button>
              <button class="tool" id="btnFile" title="添加文件" aria-label="添加文件">
                <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg>
              </button>
              <button class="tool" id="btnFolder" title="添加整个文件夹" aria-label="添加整个文件夹">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              </button>
              <button class="tool" id="btnSnap" title="截屏发送（框选区域）" aria-label="截屏发送">
                <svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3.2"/></svg>
              </button>
              <button class="tool" id="btnEmoji" aria-controls="emojiPanel" aria-expanded="false" title="表情" aria-label="表情">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9h.01M15 9h.01"/></svg>
              </button>
              <button class="tool" id="btnGame" title="打开娱乐" aria-label="打开娱乐">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="11" height="16" rx="2"/><path d="M18 8v10a2 2 0 0 1-2 2H8"/><circle cx="8.5" cy="10" r="1.2"/><path d="M6.5 17h5"/></svg>
              </button>
            </div>
            <div class="composer-right">
              <span class="hint" id="hint" role="status"></span>
              <button class="send-btn" id="btnSend" disabled>发送 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></button>
            </div>
          </div>
        </div>
        <div class="emoji-panel hidden" id="emojiPanel"></div>
      </div>
    </div>

    <section class="transfer-page hidden" id="transferView" aria-labelledby="transferHeading">
      <header class="transfer-head">
        <div><h1 id="transferHeading" tabindex="-1">传输</h1><p id="transferCount">暂无传输任务</p></div>
        <button class="btn hidden" id="btnClearDone">清除已结束</button>
      </header>
      <div class="transfer-list" id="transferList" aria-label="传输记录"></div>
    </section>

    <section class="activity-page hidden" id="activityView" aria-labelledby="activityHeading">
      <header class="transfer-head">
        <div><h1 id="activityHeading" tabindex="-1">娱乐</h1><p id="activityContext">单人练习，或邀请好友一起玩。</p></div>
      </header>
      <div class="activity-list" id="activityList"></div>
    </section>

    <div class="drop-mask hidden" id="dropMask">
      <div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><strong>松开加入待发送</strong><span>确认后再发送给当前好友</span></div>
    </div>
  </main>
</div>

<div class="modal-mask hidden" id="modalMask"><div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览"><button class="lightbox-close" id="lightboxClose" aria-label="关闭图片预览">×</button><img id="lightboxImg" alt=""></div>
<div class="toast-host" id="toast" role="status"></div>

<!-- 牌桌：斗地主（房主进程当裁判，其他人轮询状态） -->
<div class="game-mask hidden" id="gameMask">
  <div class="game-table">
    <header class="gt-head">
      <span class="gt-title">斗地主</span>
      <span class="gt-room" id="gameRoom"></span>
      <span class="gt-bottom" id="gameBottom"></span>
      <span class="gt-status" id="gameStatus"></span>
      <button class="set-close" id="gameClose" aria-label="关闭">×</button>
    </header>
    <div class="gt-felt">
      <div class="seat" id="gameSeat0"></div>
      <div class="seat" id="gameSeat1"></div>
      <div class="gt-center">
        <div class="table-last" id="gameLast"></div>
        <div class="table-result hidden" id="gameResult"></div>
      </div>
    </div>
    <div class="gt-counter" id="gameCounter"></div>
    <div class="my-play" id="myPlay"></div>
    <div class="gt-hand" id="gameHand"></div>
    <div class="gt-actions">
      <div class="gt-bid hidden" id="gameBid">
        <button class="btn" id="gameNoBid">不叫</button>
        <button class="btn" data-bid="1">1 分</button>
        <button class="btn" data-bid="2">2 分</button>
        <button class="btn primary" data-bid="3">3 分</button>
      </div>
      <div class="gt-play hidden" id="gamePlay">
        <button class="btn" id="gameHint">提示</button>
        <button class="btn" id="gamePass">不出</button>
        <button class="btn primary" id="gameDoPlay">出牌</button>
      </div>
      <button class="btn danger sm" id="gameLeave">离开牌桌</button>
    </div>
  </div>
</div>

<!-- 牌桌：四川麻将（血战到底） -->
<div class="mj-mask hidden" id="mjMask">
  <div class="mj-table">
    <header class="gt-head">
      <span class="gt-title">四川麻将 · 血战到底</span>
      <span class="gt-room" id="mjRoom"></span>
      <span class="gt-room" id="mjWall"></span>
      <span class="gt-status" id="mjStatus"></span>
      <button class="set-close" id="mjClose" aria-label="关闭">×</button>
    </header>
    <div class="mj-felt">
      <div class="mj-seat" id="mjSeat0"></div>
      <div class="mj-seat" id="mjSeat1"></div>
      <div class="mj-seat" id="mjSeat2"></div>
      <div class="mj-center" id="mjLast"></div>
      <div class="table-result hidden" id="mjResult"></div>
    </div>
    <div class="mj-que hidden" id="mjQue"></div>
    <div class="mj-me" id="mjMe"></div>
    <div class="mj-hand" id="mjHand"></div>
  </div>
</div>

<!-- 四川麻将（开源网页游戏整包内嵌） -->
<div class="mjframe-mask hidden" id="mjFrameMask">
  <div class="mjframe-box">
    <div class="mjframe-bar">
      <div class="mjframe-title"><span>近传牌桌</span><strong>四川麻将 <small>血战到底</small></strong></div>
      <div class="mjframe-controls">
        <button id="mjFrameMin" type="button" aria-label="收起牌桌" title="收起牌桌">−</button>
        <button id="mjFrameClose" type="button" aria-label="退出牌桌" title="退出牌桌">×</button>
      </div>
    </div>
    <iframe id="mjFrame" title="四川麻将牌桌" src="about:blank" allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<input type="file" id="fileInput" multiple hidden>
<input type="file" id="imageInput" accept="image/*" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<script src="/static/appearance.js"></script>
<script src="/static/clipboard.js"></script>
<script src="/static/app.js"></script>
<script src="/static/chat-tools.js"></script>
<script src="/static/game.js"></script>
<script src="/static/activities.js"></script>
<script src="/static/mj.js"></script>
</body>
</html>
