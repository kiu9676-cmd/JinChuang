name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare and test
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements-macos.txt
          python -m unittest discover -s tests
      - name: Build and validate native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          source .venv/bin/activate
          bash build.sh
      - name: Start the archived build and verify the WebKit window
        timeout-minutes: 2
        run: |
          work="$(mktemp -d)"
          archive=(dist/JinChuan-v*-macOS-*.zip)
          ditto -x -k "${archive[0]}" "$work/unpacked"
          if ! "$work/unpacked/JinChuan.app/Contents/MacOS/JinChuan" --smoke-test --data-dir "$work/data"; then
            cat "$work/data/lanbridge.log"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JinChuan-macOS-${{ matrix.arch }}
          path: dist/JinChuan-v*-macOS-*.zip
          if-no-files-found: error
