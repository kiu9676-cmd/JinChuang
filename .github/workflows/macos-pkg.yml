name: Build verified macOS PKG for v1.6.6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jinchuan-macos-pkg-v166
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'kiu9676-cmd/JinChuang' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            sha: 180f1568a012b9dace03c9de76b731cc806f4dc9b1efcfeede52fe723996071a
          - runner: macos-15-intel
            arch: x86_64
            sha: 4855f9d1258069afa7eaae5b4a8f8da1b4d7cb0af8543f7ea17ef75e27fbddef
    env:
      ARCH: ${{ matrix.arch }}
      APP_ZIP_SHA256: ${{ matrix.sha }}
    steps:
      - name: Build a native installer from the verified app
        shell: bash
        run: |
          test "$(uname -m)" = "$ARCH"
          stem="JinChuan-v1.6.6-macOS-$ARCH"
          curl --fail --location --retry 3 --max-time 90 -o "$stem.zip"             "https://github.com/kiu9676-cmd/JinChuang/releases/download/v1.6.6/$stem.zip"
          printf '%s  %s.zip\n' "$APP_ZIP_SHA256" "$stem" | shasum -a 256 -c -
          ditto -x -k "$stem.zip" unpacked
          app="unpacked/JinChuan.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/JinChuan")" = "$ARCH"
          plutil -create xml1 requirements.plist
          plutil -insert os -json '["15.0"]' requirements.plist
          plutil -insert arch -json "[\"$ARCH\"]" requirements.plist
          productbuild --product requirements.plist --component "$app" /Applications "$stem.pkg"
          pkgutil --expand "$stem.pkg" expanded
          test -f expanded/Distribution
      - name: Install into Applications and start its WebKit window
        shell: bash
        timeout-minutes: 4
        run: |
          test ! -e /Applications/JinChuan.app
          sudo /usr/sbin/installer -verbose -pkg "JinChuan-v1.6.6-macOS-$ARCH.pkg" -target /
          app=/Applications/JinChuan.app
          codesign --verify --deep --strict "$app"
          cmp "unpacked/JinChuan.app/Contents/MacOS/JinChuan" "$app/Contents/MacOS/JinChuan"
          data="$(mktemp -d)"
          if ! "$app/Contents/MacOS/JinChuan" --smoke-test --data-dir "$data"; then
            cat "$data/lanbridge.log"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JinChuan-v1.6.6-macOS-${{ matrix.arch }}-installer
          path: JinChuan-v1.6.6-macOS-${{ matrix.arch }}.pkg
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: JinChuan-v1.6.6-macOS-*-installer
          merge-multiple: true
          path: installers
      - name: Add only the two verified PKG assets
        shell: bash
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/v1.6.6"
          gh api "$endpoint" > before.json
          jq -e '.id == 454311488 and .draft == false and .immutable == false' before.json
          for arch in arm64 x86_64; do
            filename="JinChuan-v1.6.6-macOS-$arch.pkg"
            digest="sha256:$(sha256sum "installers/$filename" | cut -d ' ' -f 1)"
            existing="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest' before.json)"
            if [[ -z "$existing" ]]; then
              gh release upload --repo "$GITHUB_REPOSITORY" v1.6.6 "installers/$filename"
            else
              test "$existing" = "$digest"
            fi
          done
          gh api "$endpoint" > after.json
          jq -e --slurpfile before before.json '
            [.assets[] | select(.name | endswith(".pkg") | not) | [.id, .name, .digest, .size]] | sort ==
            ([$before[0].assets[] | select(.name | endswith(".pkg") | not) | [.id, .name, .digest, .size]] | sort)
          ' after.json
          for arch in arm64 x86_64; do
            filename="JinChuan-v1.6.6-macOS-$arch.pkg"
            digest="sha256:$(sha256sum "installers/$filename" | cut -d ' ' -f 1)"
            jq -e --arg name "$filename" --arg digest "$digest" '
              any(.assets[]; .name == $name and .digest == $digest and .state == "uploaded")
            ' after.json
          done
