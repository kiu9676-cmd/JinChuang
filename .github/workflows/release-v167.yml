name: Build and publish v1.6.7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-jinchuan-v167
  cancel-in-progress: false

jobs:
  mac:
    if: github.repository == 'kiu9676-cmd/JinChuang' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            min: '15.0'
            name: arm64
          - runner: macos-15-intel
            arch: x86_64
            min: '13.7'
            name: Ventura-x86_64
    env:
      ARCH: ${{ matrix.arch }}
      MIN_OS: ${{ matrix.min }}
      MACOS_MIN_VERSION: ${{ matrix.min }}
      INSTALLER_FILE: JinChuan-v1.6.7-macOS-${{ matrix.name }}.pkg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Python tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements-macos.txt
          python -m unittest discover -s tests
      - name: Build and check the deployment target
        run: |
          source .venv/bin/activate
          test "$(uname -m)" = "$ARCH"
          bash build.sh
          mkdir unpacked
          ditto dist/JinChuan.app unpacked/JinChuan.app
          app=unpacked/JinChuan.app
          test "$(lipo -archs "$app/Contents/MacOS/JinChuan")" = "$ARCH"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$app/Contents/Info.plist")" = "$MIN_OS"
          python3 - "$app" "$MIN_OS" "$ARCH" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          def version(text):
              parts = tuple(int(x) for x in text.split("."))
              return (parts + (0, 0))[:3]
          target = version(sys.argv[2])
          audited = 0
          for file in sorted(app.rglob("*")):
              if file.is_symlink() or not file.is_file():
                  continue
              with file.open("rb") as source:
                  header = source.read(8)
              if len(header) != 8 or header[:4].hex() != "cffaedfe":
                  if header[:4].hex() in ("cafebabe", "cafebabf", "feedfacf", "cefaedfe"):
                      raise RuntimeError(f"Unexpected native binary: {file}")
                  continue
              if header[4:8].hex() != {"x86_64":"07000001", "arm64":"0c000001"}[sys.argv[3]]:
                  raise RuntimeError(f"Native binary does not match {sys.argv[3]}: {file}")
              commands = subprocess.check_output(["otool", "-l", str(file)], text=True)
              versions = re.findall(
                  r"cmd LC_VERSION_MIN_MACOSX\n\s+cmdsize [0-9]+\n\s+version ([0-9.]+)"
                  r"|cmd LC_BUILD_VERSION\n\s+cmdsize [0-9]+\n\s+platform (?:MACOS|1)\n\s+minos ([0-9.]+)",
                  commands, re.IGNORECASE)
              versions = [value for match in versions for value in match if value]
              if not versions or any(version(value) > target for value in versions):
                  raise RuntimeError(f"{file}: deployment version {versions} exceeds {sys.argv[2]} or is missing")
              audited += 1
          assert audited >= 30, f"Not all bundled binaries were checked: {audited}"
          print(f"Checked {audited} native binaries against macOS {sys.argv[2]}")
          PY
          plutil -create xml1 requirements.plist
          plutil -insert os -json "[\"$MIN_OS\"]" requirements.plist
          plutil -insert arch -json "[\"$ARCH\"]" requirements.plist
          pkgbuild --analyze --root unpacked components.plist
          plutil -replace 0.BundleIsRelocatable -bool NO components.plist
          pkgbuild --root unpacked --component-plist components.plist --install-location /Applications --identifier com.jinchuan.app.installer --version 1.6.7 component.pkg
          productbuild --synthesize --product requirements.plist --package component.pkg Distribution
          productbuild --distribution Distribution --package-path . "$INSTALLER_FILE"
          pkgutil --expand "$INSTALLER_FILE" expanded
          grep -F "$MIN_OS" expanded/Distribution
      - name: Install the PKG and verify the app starts
        timeout-minutes: 4
        run: |
          test ! -e /Applications/JinChuan.app
          sudo /usr/sbin/installer -verbose -pkg "$INSTALLER_FILE" -target /
          app=/Applications/JinChuan.app
          codesign --verify --deep --strict "$app"
          cmp "unpacked/JinChuan.app/Contents/MacOS/JinChuan" "$app/Contents/MacOS/JinChuan"
          data="$(mktemp -d)"
          if ! "$app/Contents/MacOS/JinChuan" --smoke-test --data-dir "$data"; then
            cat "$data/lanbridge.log"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jinchuan-release-${{ matrix.name }}
          path: ${{ env.INSTALLER_FILE }}
          if-no-files-found: error

  windows:
    if: github.repository == 'kiu9676-cmd/JinChuang' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run tests and build Windows package
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/clipboard.test.cjs tests/mahjong-engine.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release.py --build-only --no-git --no-zip --version 1.6.7
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'dist/近传.exe' -Destination 'dist/default.exe'
          if ((Get-Item -LiteralPath 'dist/default.exe').Length -lt 1048576) { throw 'Windows package is too small' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jinchuan-release-windows
          path: dist/default.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jinchuan-release-*
          merge-multiple: true
          path: packages
      - name: Publish the three verified platform packages together
        shell: bash
        run: |
          tag=v1.6.7
          pkg_arm=JinChuan-v1.6.7-macOS-arm64.pkg
          pkg_intel=JinChuan-v1.6.7-macOS-Ventura-x86_64.pkg
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          curl --fail --location --retry 3 --max-time 90 -o packages/third-party-notices.zip "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.6.6/third-party-notices.zip"
          echo 'b3de37bd5873c21389364ab3ff19c0c3fbcc23b0728c0f20591242d73c410e21  packages/third-party-notices.zip' | sha256sum -c -
          awk '/^## v1[.]6[.]7 / {in_release=1; next} /^## / && in_release {exit} in_release {print}' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'NOTES'
          **Windows**：下载 `default.exe`。升级前退出托盘里的旧版；保留 `data/`。

          **Mac**：请选择对应的 PKG。Apple 芯片需 macOS 15+；Intel Ventura 包需 macOS 13.7+。旧 Mac 版请先手动安装本版；之后「设置 → 更新」可下载并打开安装器。安装包未经过 Apple 公证。
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft > release-state; then
            test "$(cat release-state)" = true
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "近传 $tag" --notes-file notes.md
          fi
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          release_id="$(gh api "$endpoint" | jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == true) | .id')"
          test -n "$release_id"
          gh api "$endpoint/$release_id" > draft.json
          test "$(jq -r .target_commitish draft.json)" = "$GITHUB_SHA"
          for name in default.exe "$pkg_arm" "$pkg_intel" third-party-notices.zip; do
            test -s "packages/$name"
            digest="sha256:$(sha256sum "packages/$name" | cut -d ' ' -f 1)"
            existing="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' draft.json)"
            if [[ -z "$existing" ]]; then
              gh release upload "$tag" "packages/$name" --repo "$GITHUB_REPOSITORY"
            else
              test "$existing" = "$digest"
            fi
          done
          gh api "$endpoint/$release_id" > verified.json
          for name in default.exe "$pkg_arm" "$pkg_intel" third-party-notices.zip; do
            digest="sha256:$(sha256sum "packages/$name" | cut -d ' ' -f 1)"
            jq -e --arg name "$name" --arg digest "$digest" 'any(.assets[]; .name == $name and .digest == $digest and .state == "uploaded")' verified.json
          done
          gh api --method PATCH "$endpoint/$release_id" -F draft=false -f make_latest=true --jq .html_url
          test "$(gh api "$endpoint/latest" --jq .tag_name)" = "$tag"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
